name: Release image and update package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed to inspect existing tags for same-day collision

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix substituters
        run: |
          mkdir -p ~/.config/nix
          echo "extra-substituters = https://nix-community.cachix.org https://cache.nixos.org" >> ~/.config/nix/nix.conf
          echo "extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" >> ~/.config/nix/nix.conf

      # Cachix configures the substituter+public key automatically. Pushes are
      # skipped for PR/fork builds (no token); master pushes upload everything
      # built during this run.
      - uses: cachix/cachix-action@v17
        with:
          name: nix-hil-runner
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}

      - name: Compute CalVer version
        id: ver
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y.%-m.%-d)
          base="v${today}"

          # First release of the day: bare CalVer (e.g. v2026.5.7).
          # Subsequent same-day releases append the UTC build time as HHMM
          # (e.g. v2026.5.7.1430) — sortable and points at when the build ran.
          # If even HHMM collides (manual reruns within the same minute),
          # append the GitHub Actions run id, which is globally unique.
          git fetch --tags --quiet
          if ! git rev-parse "$base" >/dev/null 2>&1; then
            tag="$base"
          else
            hhmm=$(date -u +%H%M)
            candidate="${base}.${hhmm}"
            if ! git rev-parse "$candidate" >/dev/null 2>&1; then
              tag="$candidate"
            else
              tag="${base}.${hhmm}.r${RUN_ID}"
            fi
          fi

          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed tag=$tag version=$version"

      - name: Stamp VERSION (untracked, baked into the image build)
        run: printf '%s' '${{ steps.ver.outputs.version }}' > VERSION

      - name: Build image
        run: nix build -L .#packages.aarch64-linux.image -o result-image

      - name: Build sysupdate package
        run: nix build -L .#packages.aarch64-linux.update-package -o result-update

      - name: Stage release artifacts
        run: |
          mkdir -p output
          cp -L result-image/*.raw output/ || true
          cp -L result-update/* output/

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ steps.ver.outputs.tag }}
          path: output/*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ needs.build.outputs.tag }}
          path: output

      - name: Create tag
        run: |
          set -euo pipefail
          tag='${{ needs.build.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          files: output/*
          generate_release_notes: true

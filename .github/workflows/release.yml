name: Release image and update package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed to inspect existing tags for same-day collision

      # Ubuntu 24.04 ships AppArmor's unprivileged userns restriction enabled,
      # which breaks `image.repart`'s nested `unshare --user --map-root-user`
      # inside the Nix build sandbox (uid_map write -> EPERM).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # cache-nix-action requires these to keep build deps reachable via
          # GC roots, otherwise the saved store is missing intermediate paths.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true

      - name: Configure Nix substituters
        run: |
          mkdir -p ~/.config/nix
          echo "extra-substituters = https://nix-community.cachix.org https://cache.nixos.org" >> ~/.config/nix/nix.conf
          echo "extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" >> ~/.config/nix/nix.conf

      # Cache /nix/store between runs. Primary key tracks flake.lock; on miss
      # we restore from the most recent prefix-matching cache so changing only
      # one input still gets most of the closure. After the build, the action
      # GCs the store down to gc-max-store-size before saving, keeping us
      # under GitHub's 10 GB per-repo cap.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Compute CalVer version
        id: ver
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y.%-m.%-d)
          base="v${today}"

          # First release of the day: bare CalVer (e.g. v2026.5.7).
          # Subsequent same-day releases append the UTC build time as HHMM
          # (e.g. v2026.5.7.1430) — sortable and points at when the build ran.
          # If even HHMM collides (manual reruns within the same minute),
          # append the GitHub Actions run id, which is globally unique.
          git fetch --tags --quiet
          if ! git rev-parse "$base" >/dev/null 2>&1; then
            tag="$base"
          else
            hhmm=$(date -u +%H%M)
            candidate="${base}.${hhmm}"
            if ! git rev-parse "$candidate" >/dev/null 2>&1; then
              tag="$candidate"
            else
              tag="${base}.${hhmm}.r${RUN_ID}"
            fi
          fi

          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed tag=$tag version=$version"

      - name: Stamp VERSION (untracked, baked into the image build)
        run: printf '%s' '${{ steps.ver.outputs.version }}' > VERSION

      - name: Build image
        run: nix build -L .#packages.aarch64-linux.image -o result-image

      - name: Build sysupdate package
        run: nix build -L .#packages.aarch64-linux.update-package -o result-update

      - name: Stage release artifacts
        run: |
          mkdir -p output
          for artifact in result-image/*.raw; do
            case "$artifact" in
              *.store.raw) continue ;;
            esac
            cp -L "$artifact" output/
          done
          cp -L result-update/* output/
          find output -maxdepth 1 -type f -size +1900M -print0 |
            while IFS= read -r -d '' artifact; do
              split -b 1900M -d -a 3 "$artifact" "$artifact.part-"
              rm "$artifact"
            done
          rm -f output/SHA256SUMS
          (cd output && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ steps.ver.outputs.tag }}
          path: output/*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ needs.build.outputs.tag }}
          path: output

      - name: Create tag
        run: |
          set -euo pipefail
          tag='${{ needs.build.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          files: output/*
          generate_release_notes: true
